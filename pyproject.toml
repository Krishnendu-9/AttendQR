[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "attendqr"
version = "1.0.0"
description = "QR-based attendance management for colleges"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Private :: Do Not Upload",
]
# Dependencies stay in requirements.txt (pinned versions in requirements.lock).
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/Krishnendu-9/AttendQR"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# templates/, static/ and migrations/ live beside the package, so install it
# editable (pip install -e .) rather than as a regular wheel.
[tool.setuptools.packages.find]
include = ["attendqr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra"
filterwarnings = [
    "error::sqlalchemy.exc.LegacyAPIWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "F",    # pyflakes: undefined names, unused imports and variables
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # import order
    "B",    # bugbear: likely bugs and footguns
    "S",    # bandit: security-sensitive calls
    "UP",   # newer syntax for Python 3.11+
    "ISC",  # implicit string concatenation (a missing comma joins two strings)
    "C4",   # comprehensions
    "PIE",  # unnecessary code
    "RUF",  # ruff's own checks, including unused noqa comments
]
ignore = [
    "E501",  # long lines: left to review rather than enforced
]

[tool.ruff.lint.per-file-ignores]
# Tests assert and use fixed passwords and keys on purpose.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["attendqr", "conftest"]
