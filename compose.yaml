services:
  attendqr:
    build: .
    image: attendqr:local
    init: true
    restart: unless-stopped
    ports:
      - "${ATTENDQR_PORT:-5000}:5000"
    # Settings from .env (see .env.example) are passed to the app.
    env_file:
      - path: .env
        required: false
    environment:
      # A container cannot detect the host's LAN IP, so the QR address must be given.
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL to the address phones use to reach this server, e.g. http://192.168.0.170:5000}
    volumes:
      - attendqr-data:/app/instance

volumes:
  attendqr-data:
