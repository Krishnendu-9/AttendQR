<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark Attendance | QR Attendance System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="scan-page">
  <main class="auth-card">
    <div class="auth-mark">
      <i class="bi bi-check2-square"></i>
    </div>
    <h1 class="h4 fw-bold mb-1">Mark Attendance</h1>
    <p class="text-muted mb-4">Enter your roll number to register attendance for this session.</p>

    <label class="form-label" for="roll_no">Roll Number</label>
    <input class="form-control mb-3" id="roll_no" placeholder="Enter roll number" autocomplete="off">
    <button class="btn btn-primary w-100" id="submitBtn" onclick="markAttendance()">
      <i class="bi bi-send-check me-1"></i> Submit Attendance
    </button>
    <div id="msg" class="mt-3"></div>
  </main>

  <script>
  function markAttendance() {
    const roll_no = document.getElementById('roll_no').value.trim();
    if (!roll_no) return;

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;

    fetch('/mark_attendance', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token: '{{ token }}', roll_no: roll_no})
    })
    .then(r => r.json())
    .then(data => {
      document.getElementById('msg').innerHTML =
        `<div class="alert alert-${data.success ? 'success' : 'danger'}">${data.message}</div>`;

      if (data.success) {
        document.getElementById('roll_no').disabled = true;
        setTimeout(() => window.close(), 3000);
      } else {
        btn.disabled = false;
      }
    });
  }
  </script>
</body>
</html>
