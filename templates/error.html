<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{ title }} | AttendQR</title>
{% include '_head.html' %}
</head>
<body class="login-page">
  <main class="auth-card text-center">
    <div class="auth-mark">
      <i class="bi {{ icon }}"></i>
    </div>
    <div class="mb-2 fw-bold">AttendQR</div>
    <div class="text-muted small mb-1">Error {{ code }}</div>
    <h1 class="h4 fw-bold mb-2">{{ title }}</h1>
    <p class="text-muted mb-4">{{ message }}</p>
    <div class="d-flex flex-wrap justify-content-center gap-2">
      {% if current_user.is_authenticated %}
      <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary"><i class="bi bi-house me-1"></i> Dashboard</a>
      {% else %}
      <a href="{{ url_for('auth.login') }}" class="btn btn-primary"><i class="bi bi-box-arrow-in-right me-1"></i> Log in</a>
      {% endif %}
    </div>
  </main>
</body>
</html>
