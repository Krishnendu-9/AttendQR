<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login | AttendQR</title>
{% include '_head.html' %}
</head>
<body class="login-page">
  <main class="auth-card">
    <div class="auth-mark">
      <i class="bi bi-qr-code-scan"></i>
    </div>
    <div class="text-center mb-2 fw-bold">AttendQR</div>
    <h1 class="h4 fw-bold mb-1">Login</h1>
    <p class="text-muted mb-4">Sign in with your email to access the QR-based attendance system.</p>

    {% with messages = get_flashed_messages(with_categories=True) %}
      {% for category, message in messages %}
      <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% if error %}
    <div class="alert alert-danger" role="alert">
      <i class="bi bi-exclamation-triangle me-1"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="next" value="{{ next_url or '' }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="username">Email</label>
        <input class="form-control" id="username" name="username" type="email" placeholder="Enter email" autocomplete="username" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <div class="input-group password-field">
          <input class="form-control" id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
          <button class="btn btn-outline-secondary password-toggle" type="button" data-target="password" aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>
      <button class="btn btn-primary w-100" type="submit">
        <i class="bi bi-box-arrow-in-right me-1"></i> Login
      </button>
    </form>
  </main>
</body>
</html>
