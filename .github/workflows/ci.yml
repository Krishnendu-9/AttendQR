name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Advisories are published without any change here; check every Monday as well.
    - cron: '0 3 * * 1'

# Actions are pinned to commit SHAs (tags can be moved); the comment gives the release.
# To update, look up the new tag's commit, e.g. `git ls-remote https://github.com/actions/checkout v7.0.1`.

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.13"

    - name: Install pip-audit
      run: python -m pip install pip-audit==2.10.1

    # Fails on any known advisory in requirements.lock, the dependencies that ship.
    # Dev tools are not audited. See "Dependency auditing" in SECURITY.md before
    # adding an --ignore-vuln.
    - name: Audit pinned production dependencies
      run: pip-audit -r requirements.lock --no-deps --disable-pip --desc on --progress-spinner off

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.lock
          requirements-dev.txt

    - name: Install pinned dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock
        pip install pytest==9.2.0 ruff==0.17.5 pytest-cov==7.1.0 pyright==1.1.414

    - name: Lint
      run: ruff check --output-format=github .

    - name: Type check
      env:
        PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"
      # Settings (and the rules turned off, with the reason) are in pyproject.toml.
      run: pyright --pythonpath "$(which python)"

    - name: Check migrations match the models
      env:
        DATABASE_URL: sqlite:////tmp/attendqr-ci.db
      run: |
        flask --app wsgi init-db
        flask --app wsgi db check

    - name: Run tests with coverage
      run: python -m pytest -q --cov=attendqr --cov-report=term-missing:skip-covered --cov-fail-under=90

  stylesheet:
    name: Stylesheet up to date
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    # static/css/app.css is committed. A template that uses a new class without a rebuild would
    # ship without that class's CSS. The script downloads the pinned Tailwind binary and checks
    # its SHA-256 before running it.
    - name: Compare app.css with a fresh Tailwind build
      run: python3 scripts/tailwind.py --check

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.13"
        cache: 'pip'
        cache-dependency-path: |
          requirements.lock
          requirements-dev.txt

    - name: Install pinned dependencies, Playwright and Chromium
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock
        pip install pytest==9.2.0 pytest-playwright==0.10.0 playwright==1.65.2 axe-playwright-python==0.1.8
        python -m playwright install --with-deps chromium

    # The QR class flow in Chromium (teacher's screen and a student's phone) and an axe-core
    # accessibility check of the main pages in both themes. See tests/browser/test_browser.py.
    - name: Run the browser tests
      run: python -m pytest -m browser tests/browser --screenshot only-on-failure --output test-results

    - name: Keep screenshots of failed tests
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: browser-test-screenshots
        path: test-results/
        retention-days: 7

  postgres:
    name: Tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: attendqr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Every test starts from an emptied schema in this database (see tests/conftest.py).
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/attendqr_test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.13"
        cache: 'pip'
        cache-dependency-path: |
          requirements.lock
          requirements-dev.txt

    - name: Install pinned dependencies and the PostgreSQL driver
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock
        pip install pytest==9.2.0 "psycopg[binary]==3.3.9"

    - name: Check migrations match the models on PostgreSQL
      env:
        DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      run: |
        flask --app wsgi init-db
        flask --app wsgi db check

    - name: Run tests on PostgreSQL
      run: python -m pytest -q

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: http://127.0.0.1:5000
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Build image
      run: docker compose build

    - name: Start and wait for the health check
      run: docker compose up --detach --wait --wait-timeout 90

    - name: Run the QR attendance flow against the container
      run: |
        PRINCIPAL_PASSWORD="$(docker compose exec -T attendqr cat /app/instance/initial_principal_password)" \
          python3 scripts/docker_smoke.py "$APP_BASE_URL"

    - name: Check the one-time password file was deleted
      run: docker compose exec -T attendqr sh -c '! test -e /app/instance/initial_principal_password'

    - name: Show server logs
      if: failure()
      run: docker compose logs

    - name: Stop
      if: always()
      run: docker compose down --volumes
