name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Advisories are published without any change here; check every Monday as well.
    - cron: '0 3 * * 1'

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install pip-audit
      run: python -m pip install pip-audit==2.10.1

    # Fails on any known advisory in requirements.lock, the dependencies that ship.
    # Dev tools are not audited. See "Dependency auditing" in SECURITY.md before
    # adding an --ignore-vuln.
    - name: Audit pinned production dependencies
      run: pip-audit -r requirements.lock --no-deps --disable-pip --desc on --progress-spinner off

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.lock
          requirements-dev.txt

    - name: Install pinned dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock
        pip install pytest ruff==0.17.2

    - name: Lint
      run: ruff check --output-format=github .

    - name: Check migrations match the models
      env:
        DATABASE_URL: sqlite:////tmp/attendqr-ci.db
      run: |
        flask --app wsgi init-db
        flask --app wsgi db check

    - name: Run tests
      run: python -m pytest -q

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: http://127.0.0.1:5000
    steps:
    - uses: actions/checkout@v4

    - name: Build image
      run: docker compose build

    - name: Start and wait for the health check
      run: docker compose up --detach --wait --wait-timeout 90

    - name: Run the QR attendance flow against the container
      run: python3 scripts/docker_smoke.py "$APP_BASE_URL"

    - name: Show server logs
      if: failure()
      run: docker compose logs

    - name: Stop
      if: always()
      run: docker compose down --volumes
